name: Runner diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  ubuntu:
    name: runner-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner allocation
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_NAME=$RUNNER_NAME"
          uname -a
          node --version
          npm --version

  windows:
    name: runner-windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner allocation
        shell: pwsh
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          node --version
          npm --version
