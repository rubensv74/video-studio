name: Render demo

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      VIDEO_STUDIO_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Source contract smoke test
        run: node scripts/smoke-foundation.mjs
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate deterministic media fixtures
        run: node scripts/generate-media-fixtures.mjs
      - name: Generate deterministic AI-media fixtures
        run: npm run fixtures:ai-media
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            if npm ci --no-audit --no-fund; then
              echo "Lockfile installation succeeded"
            else
              echo "Lockfile is stale for this branch; resolving the new dependency graph"
              npm install --no-audit --no-fund
            fi
          else
            npm install --no-audit --no-fund
          fi
      - name: Persist generated lockfile
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already tracked and unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json

          if git diff --cached --quiet; then
            echo "No lockfile changes to persist"
            exit 0
          fi

          git commit -m "chore: persist verified npm lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Validate foundation
        run: npm run check
      - name: Build control plane
        run: npm run build:control-plane
      - name: Render primary
        run: npm run render -- projects/demo-product/project.json
      - name: Verify primary
        run: npm run verify:render -- projects/demo-product/project.json
      - name: Render derivatives
        run: npm run render:derivatives -- projects/demo-product/project.json
      - name: Verify media stack
        run: npm run verify:media-stack -- projects/demo-product/project.json
      - name: Render advanced visuals
        run: npm run render:advanced
      - name: Verify advanced visuals
        run: npm run verify:render -- projects/advanced-visuals-demo/project.json
      - name: Extract advanced QA frames
        run: npm run extract:advanced-qa
      - name: Verify advanced QA frames
        run: npm run verify:advanced-qa
      - name: Render AI media adapter demo
        run: npm run render:ai-media
      - name: Verify AI media adapter demo
        run: npm run verify:ai-media
      - name: Render Firulais WhatsApp meme
        run: npm run render:firulais
      - name: Verify Firulais WhatsApp meme
        run: npm run verify:render -- projects/firulais-protocol-barca/project.json
      - name: Render Firulais GIF derivative
        run: npm run render:derivatives -- projects/firulais-protocol-barca/project.json
      - name: Render scaffolded product presets
        run: npm run render:productization
      - name: Verify runtime theme pack
        run: npm run verify:runtime-theme -- .generated/productization/generated-portrait-9x16/project.json
      - name: Scale batch first execution
        run: npm run render:batch -- batches/productization-ci.json --clear-cache --report output/scale/batch-first.json
      - name: Scale batch cache replay
        run: npm run render:batch -- batches/productization-ci.json --report output/scale/batch-second.json
      - name: Verify scale reports
        run: npm run verify:scale-report -- output/scale/batch-first.json output/scale/batch-second.json
      - uses: actions/upload-artifact@v7
        with:
          name: video-studio-demo
          path: |
            output/remotion-demo.mp4
            output/remotion-demo.webm
            output/remotion-demo.gif
            output/remotion-demo-normalized.mp4
            output/frames/*.png
            output/advanced-visuals-demo.mp4
            output/advanced-visuals-qa/*.png
            output/ai-media-demo.mp4
            output/ai-media-demo-frame.png
            output/firulais-protocol-barca.mp4
            output/firulais-protocol-barca.gif
            output/generated-media/*.json
            output/operations/*.json
            apps/remotion-studio/public/generated-media/**
            output/productization/*.mp4
            output/scale/*.json
            output/scale/cache/*.json
            apps/control-plane/dist/**
            package-lock.json
